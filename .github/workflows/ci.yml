name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release from this commit
        type: boolean
        default: false
      bump:
        description: Version bump (auto uses feat commits for minor, otherwise patch)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check clang-format version
        run: clang-format --version

      - name: Check formatting
        run: |
          Get-ChildItem -Recurse -Include *.c,*.h,*.cpp,*.hpp src,include,tests,tools |
            ForEach-Object {
              clang-format --dry-run --Werror $_.FullName
            }

      - name: Determine version
        id: version
        shell: pwsh
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
          BUMP: ${{ inputs.bump }}
        run: |
          $tag = git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>$null
          if (-not $tag) { $tag = "v0.0.0" }
          $parts = $tag.TrimStart("v").Split(".") | ForEach-Object { [int]$_ }
          if ($env:RELEASE -eq "true") {
            if ("${{ github.ref }}" -ne "refs/heads/master") {
              throw "Releases are published from master only"
            }
            $range = if ($tag -eq "v0.0.0") { "HEAD" } else { "$tag..HEAD" }
            $subjects = @(git log $range --format=%s)
            if ($subjects.Count -eq 0) {
              throw "No commits since $tag"
            }
            $bump = $env:BUMP
            if ($bump -eq "auto") {
              $bump = if ($subjects | Where-Object { $_ -match '^feat(\(.+\))?!?:' }) { "minor" } else { "patch" }
            }
            switch ($bump) {
              "major" { $parts = @(($parts[0] + 1), 0, 0) }
              "minor" { $parts = @($parts[0], ($parts[1] + 1), 0) }
              default { $parts = @($parts[0], $parts[1], ($parts[2] + 1)) }
            }
            Write-Host "Releasing $($parts -join '.') ($bump bump over $tag, $($subjects.Count) commits)"
          }
          "version=$($parts -join '.')" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: >
          cmake -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DREACH_VERSION=${{ steps.version.outputs.version }}

      - name: Build Debug
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Build release ZIP
        run: cmake --build build --config Release --target reach_release_zip --parallel

      - name: Verify release ZIP layout
        shell: pwsh
        run: |
          $zip = "build/dist/reach-v${{ steps.version.outputs.version }}-Release.zip"
          if (-not (Test-Path $zip)) {
            throw "Missing $zip"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          $required = @(
            "reach/reach.exe",
            "reach/reachctl.exe",
            "reach/reachElevate.exe",
            "reach/reachService.exe",
            "reach/reachSetting.exe",
            "reach/reachUpdater.exe",
            "reach/reachWatchdog.exe",
            "reach/reach_update_helper.exe"
          )
          $missing = $required | Where-Object { $entries -notcontains $_ }
          if ($missing) {
            throw "Release ZIP is missing files installed updaters depend on: $($missing -join ', ')"
          }

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: build/dist/reach-v${{ steps.version.outputs.version }}-Release.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ needs.build.outputs.version }}"
          gh release create $tag "reach-$tag-Release.zip" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title $tag `
            --generate-notes

      - name: Verify published update
        shell: pwsh
        run: |
          $tag = "v${{ needs.build.outputs.version }}"
          $asset = "reach-$tag-Release.zip"
          $headers = @{ Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28"; "User-Agent" = "reach-updater/1.0" }
          $latest = $null
          for ($attempt = 0; $attempt -lt 10; ++$attempt) {
            $latest = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/${{ github.repository }}/releases/latest"
            if ($latest.tag_name -eq $tag) { break }
            Start-Sleep -Seconds 6
          }
          if ($latest.tag_name -ne $tag) {
            throw "releases/latest reports $($latest.tag_name), expected $tag"
          }
          $published = $latest.assets | Where-Object { $_.name -eq $asset }
          if (-not $published) {
            throw "releases/latest has no $asset"
          }
          if ($published.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
            throw "$asset has no SHA-256 digest: '$($published.digest)'"
          }
          Invoke-WebRequest -Headers @{ "User-Agent" = "reach-updater/1.0" } $published.browser_download_url -OutFile downloaded.zip
          $actual = (Get-FileHash downloaded.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $published.digest.Substring(7).ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Downloaded $asset hash $actual does not match published digest $expected"
          }
          $local = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($local -ne $expected) {
            throw "Published $asset differs from the tested build"
          }
          Write-Host "$tag is live: $asset verified against $($published.digest)"
